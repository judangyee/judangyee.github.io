<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker>
  </defs>
  <rect width="760" height="650" fill="#ffffff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#222">One backbone pass yields judgment, selection, and action</text>
  <text x="24" y="56" font-size="12.5" fill="#666">ARD-VLA 1.0 closed-loop structure · colors indicate role</text>
  <g font-size="12.5" fill="#555">
    <!-- inputs -->
    <rect x="40" y="76" width="200" height="66" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="54" y="98" font-size="14" font-weight="700" fill="#222">Camera image</text>
    <text x="54" y="116">Current scene</text><text x="54" y="132">Judged on post-execution view</text>
    <rect x="280" y="76" width="200" height="66" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="294" y="98" font-size="14" font-weight="700" fill="#222">Instruction</text>
    <text x="294" y="116">Goal + current subtask</text><text x="294" y="132">+ completed steps</text>
    <rect x="520" y="76" width="200" height="66" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="534" y="98" font-size="14" font-weight="700" fill="#222">Robot state</text>
    <text x="534" y="116">Bimanual, 16 DoF</text><text x="534" y="132">7 joints + 1 gripper per arm</text>
    <!-- backbone -->
    <rect x="40" y="172" width="680" height="60" rx="8" fill="#e9f1fc" stroke="#3b7dd8" stroke-width="1.8"/>
    <text x="54" y="196" font-size="14" font-weight="700" fill="#222">SmolVLM2 backbone (shared)</text>
    <text x="54" y="216">Computes the prefix once; three branches share the same features</text>
    <!-- heads -->
    <rect x="40" y="262" width="200" height="82" rx="8" fill="#fdf1eb" stroke="#e07a4f" stroke-width="1.8"/>
    <text x="54" y="284" font-size="14" font-weight="700" fill="#222">Judge head</text>
    <text x="54" y="302">Success prob. (calibrated)</text><text x="54" y="318">5 failure types · progress 0–1</text><text x="54" y="334" fill="#888">No gradient into backbone</text>
    <rect x="280" y="262" width="200" height="82" rx="8" fill="#fdf1eb" stroke="#e07a4f" stroke-width="1.8"/>
    <text x="294" y="284" font-size="14" font-weight="700" fill="#222">Selector head</text>
    <text x="294" y="302">Picks one allowed candidate</text><text x="294" y="318">next step · recovery · stop</text><text x="294" y="334" fill="#888">Rule table until trained</text>
    <rect x="520" y="262" width="200" height="82" rx="8" fill="#ebf7f1" stroke="#3fae7a" stroke-width="1.8"/>
    <text x="534" y="284" font-size="14" font-weight="700" fill="#222">Action expert</text>
    <text x="534" y="302">Action chunk (50 steps)</text><text x="534" y="318">Flow matching</text><text x="534" y="334" fill="#888">Original SmolVLA module</text>
    <!-- decision -->
    <rect x="40" y="374" width="440" height="104" rx="8" fill="#fdf1eb" stroke="#e07a4f" stroke-width="1.8"/>
    <text x="54" y="396" font-size="14" font-weight="700" fill="#222">Decision layer (rules, not trained)</text>
    <text x="54" y="414">ADVANCE · RETRY · RECOVER · RECHECK · STOP</text>
    <text x="54" y="431">Task-graph state: completed steps, retry counts</text>
    <text x="54" y="448">Safety: allowed candidates only; stop when limit exceeded</text>
    <text x="54" y="465" fill="#888">Sets the next instruction and whether the chunk runs</text>
    <!-- ARD heads -->
    <rect x="520" y="374" width="200" height="82" rx="8" fill="#ebf7f1" stroke="#3fae7a" stroke-width="1.8"/>
    <text x="534" y="396" font-size="14" font-weight="700" fill="#222">ARD heads</text>
    <text x="534" y="414">Stabilizer: left arm · hold</text><text x="534" y="430">Actuator: right arm · act</text><text x="534" y="446" fill="#888">Role loss α 0.3 · β 0.7</text>
    <!-- execution -->
    <rect x="520" y="512" width="200" height="60" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="534" y="536" font-size="14" font-weight="700" fill="#222">OpenArm execution</text>
    <text x="534" y="556">Stop and re-observe at end</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="140" y1="142" x2="140" y2="170"/><line x1="380" y1="142" x2="380" y2="170"/><line x1="620" y1="142" x2="620" y2="170"/>
    <line x1="140" y1="232" x2="140" y2="260"/><line x1="380" y1="232" x2="380" y2="260"/><line x1="620" y1="232" x2="620" y2="260"/>
    <line x1="140" y1="344" x2="140" y2="372"/><line x1="380" y1="344" x2="380" y2="372"/><line x1="620" y1="344" x2="620" y2="372"/>
    <line x1="480" y1="426" x2="518" y2="426"/>
    <line x1="620" y1="456" x2="620" y2="510"/>
    <path d="M518,542 H24 V109 H38" stroke-dasharray="5,4"/>
  </g>
  <text x="200" y="534" font-size="12.5" fill="#777">New observation → next cycle</text>
  <g font-size="12.5" fill="#555">
    <rect x="40" y="606" width="14" height="14" rx="3" fill="#e9f1fc" stroke="#3b7dd8"/><text x="62" y="618">Shared backbone</text>
    <rect x="200" y="606" width="14" height="14" rx="3" fill="#fdf1eb" stroke="#e07a4f"/><text x="222" y="618">Judgment: what to do</text>
    <rect x="400" y="606" width="14" height="14" rx="3" fill="#ebf7f1" stroke="#3fae7a"/><text x="422" y="618">Action: how to move</text>
  </g>
</svg>
