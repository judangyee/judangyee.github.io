<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="760" height="440" fill="#fff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#222">During execution, choices stay inside the task graph</text>
  <text x="24" y="56" font-size="12.5" fill="#666">Peg-in-hole task graph · normal path and recovery paths</text>
  <rect x="24" y="72" width="712" height="262" rx="10" fill="#f3f3f1" stroke="#dcdcd8"/>
  <text x="40" y="98" font-size="13.5" font-weight="700" fill="#222">Task graph (set before the task starts, by a human or an LLM)</text>
  <g font-size="12.5" fill="#555">
    <rect x="40" y="116" width="90" height="56" rx="8" fill="#f8f8f6" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="85" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Start</text>
    <rect x="160" y="116" width="150" height="56" rx="8" fill="#f8f8f6" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="174" y="139" font-size="14" font-weight="700" fill="#222">align</text><text x="174" y="158">Match x-y position</text>
    <rect x="365" y="116" width="160" height="56" rx="8" fill="#f8f8f6" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="379" y="139" font-size="14" font-weight="700" fill="#222">insert</text><text x="379" y="158">Insert to target depth</text>
    <rect x="580" y="116" width="130" height="56" rx="8" fill="#e5f5e8" stroke="#3a9a4a" stroke-width="2"/>
    <text x="645" y="149" text-anchor="middle" font-size="14" font-weight="700" fill="#222">Done</text>
    <rect x="125" y="216" width="185" height="84" rx="8" fill="#fbe9e2" stroke="#e07a4f" stroke-width="1.8"/>
    <text x="139" y="238" font-size="14" font-weight="700" fill="#222">Recovery candidates</text>
    <text x="139" y="256">R1 redo the same step</text><text x="139" y="272">R2 return to start pose</text><text x="139" y="288">R3 retry, new settings</text>
    <rect x="340" y="216" width="185" height="84" rx="8" fill="#fbe9e2" stroke="#e07a4f" stroke-width="1.8"/>
    <text x="354" y="238" font-size="14" font-weight="700" fill="#222">Recovery candidates</text>
    <text x="354" y="256">R1 redo the same step</text><text x="354" y="272">R2 return to start pose</text><text x="354" y="288">R3 retry, new settings</text>
    <text x="548" y="236" font-size="14" font-weight="700" fill="#222">Who picks?</text>
    <text x="548" y="254">Rule table at first</text><text x="548" y="270">Trained Selector later</text><text x="548" y="286">Both: only from the</text><text x="548" y="302">candidates on the left</text>
  </g>
  <g font-size="12" fill="#777">
    <text x="318" y="134">success</text><text x="530" y="134">success</text>
    <text x="178" y="196">fail</text><text x="244" y="196">retry</text>
    <text x="393" y="196">fail</text><text x="459" y="196">retry</text>
    <text x="226" y="356">limit exceeded</text><text x="441" y="356">limit exceeded</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="130" y1="144" x2="158" y2="144"/><line x1="310" y1="144" x2="363" y2="144"/><line x1="525" y1="144" x2="578" y2="144"/>
    <line x1="210" y1="172" x2="210" y2="214"/><line x1="236" y1="214" x2="236" y2="174" stroke-dasharray="4,3"/>
    <line x1="425" y1="172" x2="425" y2="214"/><line x1="451" y1="214" x2="451" y2="174" stroke-dasharray="4,3"/>
    <line x1="217" y1="300" x2="217" y2="374"/><line x1="432" y1="300" x2="432" y2="374"/>
  </g>
  <rect x="24" y="376" width="712" height="50" rx="8" fill="#fdecec" stroke="#d96666" stroke-width="1.8"/>
  <text x="40" y="406" font-size="14" font-weight="700" fill="#222">R4 STOP</text>
  <text x="120" y="406" font-size="12.5" fill="#555">Hold a safe pose → replan one level up while stopped (a human or an LLM edits the graph)</text>
</svg>
