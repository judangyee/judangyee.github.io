<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a9a9a"/></marker></defs>
  <rect width="760" height="660" fill="#fff"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#222">Judgment happens only after a subtask ends, from what the robot observes</text>
  <text x="24" y="56" font-size="12.5" fill="#666">One cycle of the closed-loop runner · observe and run one forward pass every cycle</text>
  <g font-size="12.5" fill="#555">
    <rect x="90" y="76" width="250" height="56" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="104" y="99" font-size="14" font-weight="700" fill="#222">Observe + build instruction</text>
    <text x="104" y="118">Instruction follows the current node</text>
    <rect x="90" y="160" width="250" height="56" rx="8" fill="#e9f1fc" stroke="#3b7dd8" stroke-width="1.8"/>
    <text x="104" y="183" font-size="14" font-weight="700" fill="#222">One backbone forward pass</text>
    <text x="104" y="202">Action chunk + Judge/Selector outputs</text>
    <polygon points="215,244 335,292 215,340 95,292" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="215" y="288" text-anchor="middle">Did the previous</text><text x="215" y="304" text-anchor="middle">subtask just end?</text>
    <rect x="430" y="246" width="290" height="100" rx="8" fill="#fdf1eb" stroke="#e07a4f" stroke-width="1.8"/>
    <text x="444" y="269" font-size="14" font-weight="700" fill="#222">Decision layer acts</text>
    <text x="444" y="288">RETRY → execute this chunk as is</text>
    <text x="444" y="304">ADVANCE · RECOVER → observe again</text>
    <text x="444" y="320">RECHECK → observe again, no execution</text>
    <text x="444" y="336">STOP → safe stop and end</text>
    <rect x="90" y="370" width="250" height="56" rx="8" fill="#ebf7f1" stroke="#3fae7a" stroke-width="1.8"/>
    <text x="104" y="393" font-size="14" font-weight="700" fill="#222">Execute chunk</text>
    <text x="104" y="412">Step by step after unnormalizing</text>
    <polygon points="215,454 345,502 215,550 85,502" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="215" y="498" text-anchor="middle">Subtask ended?</text><text x="215" y="514" text-anchor="middle">(or step budget used)</text>
    <rect x="90" y="580" width="250" height="56" rx="8" fill="#fff" stroke="#cfcfcf" stroke-width="1.5"/>
    <text x="104" y="603" font-size="14" font-weight="700" fill="#222">Stop · settle</text>
    <text x="104" y="622">Judged in the next cycle</text>
  </g>
  <g font-size="12" fill="#777">
    <text x="350" y="284">yes</text><text x="224" y="360">no</text><text x="224" y="570">yes</text><text x="56" y="492">no</text>
    <text x="560" y="390">RETRY</text><text x="600" y="150">instruction changed</text>
  </g>
  <g stroke="#9a9a9a" stroke-width="1.5" fill="none" marker-end="url(#ar)">
    <line x1="215" y1="132" x2="215" y2="158"/>
    <line x1="215" y1="216" x2="215" y2="242"/>
    <line x1="335" y1="292" x2="428" y2="292"/>
    <line x1="215" y1="340" x2="215" y2="368"/>
    <path d="M575,346 V398 H342"/>
    <line x1="215" y1="426" x2="215" y2="452"/>
    <line x1="215" y1="550" x2="215" y2="578"/>
    <path d="M85,502 H50 V104 H88" stroke-dasharray="5,4"/>
    <path d="M90,608 H30 V104" stroke-dasharray="5,4" marker-end="none"/>
    <path d="M690,246 V104 H342" stroke-dasharray="5,4"/>
  </g>
</svg>
